<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TheConnection live board</title>
<link rel="stylesheet" href="theme.css">
</head>
<body class="tc-backdrop">
<div id="app" class="tc-mount"></div>
<script type="module">
/**
 * live.html: the live board (C6). Reads the token from the URL fragment
 * (#token=...), asks serve.py's /feed for the mailbox with the token in the
 * X-TC-Token header, and draws each answer with patchBoard, so nodes and
 * wires move in place. One request at a time (look.js createPoller): the
 * next starts POLL_MS after the last settles, so a slow old answer can
 * never overwrite a newer one, and one still out after FETCH_TIMEOUT_MS is
 * aborted. A late or failed answer turns the pill to words such as
 * `stale · last answer 12 s ago · timed out`, never `live`; once a board is
 * drawn, a line over it says `stale · last answer 12 s ago` too and every
 * moving wire stops, until the next good answer. A page restored
 * from the back/forward cache starts polling again on pageshow. It only
 * reads; nothing on the page writes to the mailbox. The window is at least
 * the viewport's height, the board's frame grows to the board and the page
 * scrolls down; the legend is the footer's first row (round 2). A list of
 * the roots at the top brings each tree into view, and each tree starts
 * with a heading naming its root (item 5). Under look.js OUTLINE_BELOW_PX
 * of width (a phone) the page draws the outline instead of the graph: one
 * indented row per session and the recent traffic, no wires. ?theme=dark or ?theme=daylight picks a
 * look, the switch flips it, and ?gray=1 draws the page in grayscale, the
 * colorblind check.
 *
 * Model: Claude Opus 5.5 (the BOARD lane agent), 2026-10-14. Status: unreviewed.
 *
 * @interacts  reads #token from the fragment and ?theme and ?gray from the
 *             URL; GETs ./feed, one request at a time, POLL_MS after the
 *             last answer; reads and writes the last look
 *             in localStorage (per browser only, and the page works without
 *             it); sets data-theme and the grayscale filter on <html>;
 *             rewrites ?theme in place on a pick; builds the board under
 *             #app with look.js. The poller's timers and its request's
 *             AbortController and one ResizeObserver, all released on
 *             pagehide and made again on a pageshow from the back/forward
 *             cache; two click listeners, released with their buttons,
 *             and one per root in the roots list, released when the list
 *             is rebuilt
 * @deps       look.js, theme.css; serve.py's /feed (C5, C6)
 * @complexity one poll: O(n log n + l + r), plus look.js routeAround's
 *             search per routed pair, in patchBoard over n nodes, l
 *             links and r recent wires (tens each)
 * @alloc      one board: its drawn nodes and wires are patched in place,
 *             and each answer builds one full view that replaces the last
 *             (look.js patchBoard); the poller's one AbortController and two
 *             timers while a request is out; the last feed, which createFit
 *             keeps to lay out again on a resize
 */
import {
  createWindow, createCanvas, createRoots, setFooter, createLookSwitch, pickLook, applyLook,
  createBoard, createKit, createFit, createPoller, pillText, rootsList, CONN_WORDS, LEGEND_WORDS,
} from './look.js';

// C6 and O7: a wire moves within 3 s of a send, and one feed costs the
// server tens of ms, so a poll this often is cheap.
const POLL_MS = 3000;
// A feed answers in tens of ms. One still out after this is late: the pill
// says so, and the request is dropped before the next poll would be due.
const FETCH_TIMEOUT_MS = 2500;
// Room under the board in its frame. The board's smallest text is at
// MIN_TEXT_PX already, so it never scales down: it wraps to the canvas's
// width, the frame grows to its height and the page scrolls (look.js createFit).
const FIT_PADDING = 24;
const LOOK_KEY = 'tc-board-look';
const TOKEN_HEADER = 'X-TC-Token';

const readStored = () => { try { return localStorage.getItem(LOOK_KEY); } catch { return null; } };
const store = (look) => { try { localStorage.setItem(LOOK_KEY, look); } catch { /* private window: the pick lasts this page only */ } };

const query = new URLSearchParams(location.search);
const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
let look = pickLook(query.get('theme'), readStored());
applyLook(document, look);
if (query.get('gray') === '1') document.documentElement.style.filter = 'grayscale(1)';

const app = document.getElementById('app');
const win = createWindow(document, app, { file: 'connection.board', sub: '· TheConnection :: live' });
const lookSwitch = createLookSwitch(document, win.title, {
  look,
  onPick(next) {
    look = next;
    applyLook(document, look);
    lookSwitch.setLook(look);
    store(look);
    query.set('theme', look);
    history.replaceState(null, '', `?${query}${location.hash}`);
  },
});
// The roots, at the top: each name brings its tree into view (round 2, item 5).
const roots = createRoots(document, win.body, (id) => fit.jump(id));
const canvas = createCanvas(document, win.body);
const board = createBoard(createKit(document, canvas));
// The canvas's size comes from the observer's own entry, never a layout
// read after a patch; a resize lays the last feed out again at the new
// width, as the graph or, on a phone, the outline (win.root's data-view).
const fit = createFit(canvas, board, { padding: FIT_PADDING, Observer: ResizeObserver, mark: win.root });

const draw = (feed) => {
  fit.draw(feed);
  roots.set(rootsList(feed));
  // Listeners by pid, not by state (D15: a listener that sent reads writing).
  const pill = pillText(feed);
  win.setConn(pill.text, pill.state);
  const m = feed.machine;
  // The legend is the footer's first row, never over the board; theme.css
  // shows the one for the view drawn.
  setFooter(document, win.foot, [
    { legend: 'graph', text: feed.nodes.length ? LEGEND_WORDS.graph : LEGEND_WORDS.empty },
    { legend: 'outline', text: feed.nodes.length ? LEGEND_WORDS.outline : LEGEND_WORDS.empty },
    { text: `load ${m.load1} / ${m.cores}` }, { text: `mem free ${m.mem_avail_pct}%` }, { spacer: true },
    { text: `${feed.nodes.length} sessions · ${pill.listening} listening` }, { text: `at ${feed.at}` },
  ]);
};

const poller = createPoller({
  fetchFeed: (signal) => fetch('feed', { headers: { [TOKEN_HEADER]: token }, cache: 'no-store', signal }),
  pollMs: POLL_MS,
  timeoutMs: FETCH_TIMEOUT_MS,
  timers: { setTimeout: (fn, ms) => setTimeout(fn, ms), clearTimeout: (id) => clearTimeout(id) },
  now: () => performance.now(),
  onFeed: draw,
  onConn: (text, state) => win.setConn(text, state),
  // Over the board, `stale · last answer N s ago`, and no wire moves.
  onStale: (text) => win.setStale(text),
});

// Start on load, and again when the back/forward cache restores the page:
// the pill says it is asking until an answer lands, never a frozen `live`.
const start = () => {
  fit.start();
  if (!token) return;
  win.setConn(CONN_WORDS.asking, 'warn');
  poller.start();
};
const stop = () => {
  poller.stop();
  fit.stop();
};
if (!token) win.setConn(CONN_WORDS.noToken, 'down');
start();
addEventListener('pagehide', stop);
addEventListener('pageshow', (event) => { if (event.persisted) start(); });
</script>
</body>
</html>

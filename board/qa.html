<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>QA checklist</title>
<!--
  qa.html: the checklist page tc qa run serves (C8, "The page"). The page
  itself is built by qa.js; this file holds its frame and its style.
  Model: Claude Opus 5.5 (the QA lane agent), 2026-10-18. Status: unreviewed.
  @interacts  loads ./qa.js as a module from the run's own server; no other host
  @deps       qa.js
  @complexity O(1)
  @alloc      none beyond qa.js's
-->
<style>
:root {
  --paper: #fbfaf7;
  --ink: #1d1d1b;
  --muted: #55554f;
  --line: #bdb9ae;
  --panel: #f1efe9;
  --focus: #1f4fbf;
  --tap: 44px;
  --gap: 12px;
  --radius: 6px;
  --heavy: 3px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161615;
    --ink: #ecebe6;
    --muted: #b3b1a8;
    --line: #5c5a53;
    --panel: #22221f;
    --focus: #8fb0ff;
  }
}
:root[data-theme="dark"] {
  --paper: #161615;
  --ink: #ecebe6;
  --muted: #b3b1a8;
  --line: #5c5a53;
  --panel: #22221f;
  --focus: #8fb0ff;
}
:root[data-theme="light"] {
  --paper: #fbfaf7;
  --ink: #1d1d1b;
  --muted: #55554f;
  --line: #bdb9ae;
  --panel: #f1efe9;
  --focus: #1f4fbf;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
  overflow-wrap: anywhere;
}
#app { max-width: 44rem; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.1rem; margin: 24px 0 8px; }
.run, .counts { margin: 4px 0; color: var(--muted); }
.state { margin: 8px 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); font-weight: 600; }
.state .glyph { margin-right: 8px; }
.state[data-state="ended"], .state[data-state="lost"], .state[data-state="noToken"] { border-width: var(--heavy); border-style: double; }
.help { background: var(--panel); border-radius: var(--radius); padding: 4px 12px 8px; margin: 12px 0; }
.help h2 { margin-top: 8px; }
.keys { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
.keys dt { font-weight: 700; }
.keys dd { margin: 0; }
kbd { font: 600 0.95rem ui-monospace, "SFMono-Regular", Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; }
.row {
  border: 1px solid var(--line);
  border-left-width: 6px;
  border-radius: var(--radius);
  padding: 12px;
  margin: 0 0 var(--gap);
}
.row[data-state="pass"] { border-left-style: solid; }
.row[data-state="fail"] { border-left-style: double; }
.row[data-state="skip"] { border-left-style: dotted; }
.row:focus-visible, button:focus-visible, textarea:focus-visible { outline: var(--heavy) solid var(--focus); outline-offset: 2px; }
.item { margin: 0 0 8px; font-weight: 600; }
.number { color: var(--muted); }
.marks { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: inherit;
  min-height: var(--tap);
  min-width: var(--tap);
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
}
.mark { flex: 1 1 6rem; }
.mark[aria-pressed="true"] {
  background: var(--ink);
  color: var(--paper);
  font-weight: 700;
  outline: var(--heavy) solid var(--ink);
  outline-offset: 2px;
}
button:disabled { cursor: not-allowed; border-style: dashed; }
.chosen { margin: 8px 0; }
.note-label { display: grid; gap: 4px; color: var(--muted); }
.note {
  font: inherit;
  width: 100%;
  max-width: 100%;
  min-height: var(--tap);
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
}
.note[aria-required="true"] { border-width: var(--heavy); }
.message { margin: 8px 0 0; font-weight: 600; }
.message:empty { display: none; }
.bottom { margin: 24px 0 48px; display: grid; gap: 8px; }
.finish { font-weight: 700; border-width: var(--heavy); }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="qa.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheConnection board look</title>
<link rel="stylesheet" href="theme.css">
</head>
<body class="tc-backdrop">
<div id="app" class="tc-mount"></div>
<script type="module">
/**
 * demo.html: a scripted walk through the board look. Fake sessions and fake
 * traffic from demo-script.json, no mailbox reads. The script is in the live
 * feed's shape (C5), so the demo draws it the way live.html draws the real
 * mailbox: layoutLevels lays out the two trees, wrapped to the canvas's
 * width (at the window's 1180 px cap the second sits under the first), and
 * patchBoard moves one message at a time along its wire. It shows every state and every kind
 * of line. The page frame is live.html's: the window fills the viewport's
 * height, the page scrolls, and the legend is the footer's first row; the
 * roots list at the top brings each tree into view, and a phone draws the
 * outline instead of the graph. The switch on the title bar flips between the dark look and the
 * Daylight light look. ?theme=daylight or ?theme=dark picks one in the URL
 * (compare.html uses that); otherwise the last pick in this browser,
 * otherwise dark. ?gray=1 draws the page in grayscale, the colorblind check:
 * every state and every role must still read.
 *
 * Model: Claude Opus 5.5 (the BOARD lane agent), 2026-10-14, rewritten for
 * D7's shapes over the look kit's first demo. Status: unreviewed.
 *
 * @interacts  reads ?theme and ?gray from the URL; reads and writes the
 *             last look in localStorage (per browser only, and the page
 *             works without it); sets data-theme and the grayscale filter
 *             on <html>; rewrites ?theme in place on a pick; builds the
 *             board under #app with look.js; one interval timer, one
 *             ResizeObserver and two click listeners, the first two released
 *             on pagehide and made again on a pageshow from the
 *             back/forward cache, the listeners with their buttons; one
 *             click listener per root in the roots list, with its button
 * @deps       look.js, theme.css, demo-script.json
 * @complexity one step: O(n log n + l) in patchBoard over n = 8 nodes and
 *             l = 12 links; look.js routeAround's search per routed pair
 *             runs on the first step and on a width change only, since a
 *             step moves the flow and not the boxes; the script has s
 *             steps (9 in the shipped file)
 * @alloc      one board, built on the first step; later steps patch its
 *             nodes and wires in place, so none is rebuilt, though each step
 *             builds one full view that replaces the last (board.view); the
 *             board keeps its routed runs from one step to the next
 */
import {
  createWindow, createCanvas, createRoots, setFooter, createLookSwitch, pickLook, applyLook,
  createBoard, createKit, createFit, pillText, rootsList, hueFor, HUES, LEGEND_WORDS,
} from './look.js';

const FIT_PADDING = 24;
const LOOK_KEY = 'tc-board-look';

const readStored = () => { try { return localStorage.getItem(LOOK_KEY); } catch { return null; } };
const store = (look) => { try { localStorage.setItem(LOOK_KEY, look); } catch { /* private window: the pick lasts this page only */ } };

const query = new URLSearchParams(location.search);
let look = pickLook(query.get('theme'), readStored());
applyLook(document, look);
if (query.get('gray') === '1') document.documentElement.style.filter = 'grayscale(1)';

const demo = await (await fetch('demo-script.json')).json();
// The same pill live.html shows: listeners by pid, and the box's own word for down.
const pill = pillText(demo);
const app = document.getElementById('app');
const win = createWindow(document, app, { file: demo.window.file, sub: demo.window.sub });
win.setConn(pill.text, pill.state);
const lookSwitch = createLookSwitch(document, win.title, {
  look,
  onPick(next) {
    look = next;
    applyLook(document, look);
    lookSwitch.setLook(look);
    store(look);
    query.set('theme', look);
    history.replaceState(null, '', `?${query}`);
  },
});

const chips = document.createElement('div');
chips.className = 'tc-chips';
const h = document.createElement('span');
h.className = 'tc-h';
h.textContent = 'sessions';
chips.append(h);
for (const n of demo.nodes) {
  const c = document.createElement('span');
  c.className = 'tc-chip';
  c.dataset.hue = '';
  c.style.setProperty('--tc-chip-hue', HUES[hueFor(n.id)]);
  c.textContent = n.id;
  chips.append(c);
}
win.body.append(chips);

// The roots, at the top: each name brings its tree into view.
const roots = createRoots(document, win.body, (id) => fit.jump(id));
roots.set(rootsList(demo));
const canvas = createCanvas(document, win.body);
const board = createBoard(createKit(document, canvas));
// The legend is the footer's first row, never over the board; theme.css
// shows the one for the view drawn.
setFooter(document, win.foot, [
  { legend: 'graph', text: `${demo.legend} · ${LEGEND_WORDS.graph}` },
  { legend: 'outline', text: `${demo.legend} · ${LEGEND_WORDS.outline}` },
  ...demo.footer.map((t) => (t === null ? { spacer: true } : { text: t })),
  { text: `${demo.nodes.length} sessions · ${pill.listening} listening` },
]);

// Lay the board out to the canvas's width (renderer only): it wraps, keeps
// its size, the frame grows to its height and the page scrolls (look.js createFit).
const fit = createFit(canvas, board, { padding: FIT_PADDING, Observer: ResizeObserver, mark: win.root });

// One step's feed: the fixed nodes and links, plus the step's message as a
// wire with age 0. Its sender reads writing, listener or not, as in the live
// feed: D15 puts writing first, so a busy session shows its activity.
const feedFor = (s) => ({
  nodes: demo.nodes.map((n) => (n.id === s.from ? { ...n, state: 'writing' } : n)),
  links: demo.links,
  wires: [{ from: s.from, to: s.to, seq: s.seq, age_s: 0 }],
});

let step = 0;
const tick = () => {
  fit.draw(feedFor(demo.script[step % demo.script.length]));
  step += 1;
};
tick();
// Start on load, and again when the back/forward cache restores the page,
// so a restored demo moves instead of showing a frozen frame.
let timer = null;
const start = () => {
  fit.start();
  if (timer === null) timer = setInterval(tick, demo.stepMs);
};
const stop = () => {
  clearInterval(timer);
  timer = null;
  fit.stop();
};
start();
addEventListener('pagehide', stop);
addEventListener('pageshow', (event) => { if (event.persisted) start(); });
</script>
</body>
</html>
